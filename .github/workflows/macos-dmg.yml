name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release containing the .dmg
        type: boolean
        default: true
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS arm64 dmg
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build unsigned arm64 disk image
        run: npm run build:mac

      - name: Confirm the binary is arm64
        run: |
          set -euo pipefail
          BIN="src-tauri/target/aarch64-apple-darwin/release/real-weather"
          file "$BIN"
          file "$BIN" | grep -q "arm64"
          ls -lh src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Real-Weather-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('desktop-{0}', github.run_number) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('Real Weather desktop {0}', github.run_number) || format('Real Weather {0}', github.ref_name) }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          make_latest: ${{ github.event_name == 'push' }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Unsigned macOS Apple Silicon (arm64) build of Real Weather.

            1. Open the .dmg and drag **Real Weather** into **Applications**.
            2. In Finder, **right-click Real Weather → Open**, then click **Open**.
               macOS shows this extra prompt because the app is not signed with an Apple Developer ID.
            3. If macOS says the app is damaged or does not offer Open, run this in Terminal and try the right-click again:

               ```
               xattr -cr "/Applications/Real Weather.app"
               ```

            No API key or account is required. The app needs an internet connection for a live forecast.
