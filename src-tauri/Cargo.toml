[package]
name = "real-weather"
version = "1.0.0"
description = "Real Weather desktop app"
authors = ["Zachary Buhrts"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "real_weather_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
